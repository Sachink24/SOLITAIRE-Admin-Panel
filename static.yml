## 📌 Overview

**SOLITAIRE Admin Panel** is a centralized web-based administration and production-tracking system designed to manage business operations, leads, teams, workflow performance, and business documents from a single dashboard.

The platform provides administrators with a structured interface to monitor leads, manage team members, track production, review department performance, and generate important business documents.

### 🌐 Live Application

**[Open SOLITAIRE Admin Panel](https://sachink24.github.io/SOLITAIRE-Admin-Panel/)**

---

## 🚀 Key Features

### 🔐 Secure Admin Access

- Admin login interface
- Password recovery workflow
- Password reset interface
- Centralized administrative access
- Protected administrative operations

### 📊 Admin Dashboard

The dashboard provides an overview of operational performance, including:

- Total Leads
- Approved Leads
- Pending Leads
- Production Tracking
- Recent Activity
- Top Performers
- Quick Actions

### 👥 Team Management

Manage different operational teams from one place.

Supported teams include:

- **Business Associates (BA)**
- **Legal Team**
- **Technical Team**

Administrators can add team members with:

- Full Name
- Email
- Phone Number
- Role

### 📈 Production Tracking

Monitor production performance across different time periods:

- Week
- Month
- Half Year
- Year

This helps management evaluate productivity and identify performance trends.

### 🏆 Top Performers

Performance can be viewed department-wise:

- BA
- Legal
- Technical

This provides management with a quick view of high-performing team members.

### 📋 Lead Management

The admin interface provides lead-management functionality with:

- Lead status filtering
- Customer search
- Name/phone-based search
- Lead monitoring
- Approval and pending tracking

### 📄 Document Generation

The system includes document-generation functionality for important business documents.

Available document types include:

- Provisional Sanction Letter
- Invoice
- Quotation

Generated documents can be managed through the **Generated History** section.

### 📤 Export & Quick Actions

The dashboard provides quick-access actions for business documents and data, including:

- Export All
- Provisional Sanction
- Invoice
- Quotation

